<title>Mellonhead Content Planner</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Caveat:wght@600;700&display=swap">
<style>
/* Layout: phone-first single column, bottom tabs; laptop gets a left rail and a centered work column.
   The felt landscape (trailhead to campfire) is the header band of every screen, each screen showing its own stretch of the trail.
   Felt animals appear as framed photos where agents act. Text always sits on white or pale sage.
   Single light theme by choice: the brand rules out dark backgrounds. */
:root {
  color-scheme: light;
  --ground: #EBF0E5;
  --paper: #FFFFFF;
  --sage: #B7C4A8;
  --sage-soft: #DDE5D4;
  --line: #CAD3C0;
  --ink: #1F2A24;
  --ink-2: #48544D;
  --ink-3: #66726B;
  --coral: #F46665;       /* Mellonhead coral: shapes, dots, edges, rings. Never a fill behind ink text. */
  --peach: #F6B79A;
  --forest: #23402F;
  --bluegreen: #24485A;
  --moss: #7E8F3A;
  --plum: #5B3F63;
  --lavender: #9D88B8;
  --kraft: #C4A27A;
  --kraft-ink: #3B2C1A;
  --go: #6F8F3A;          /* readiness: green */
  --caution: #D9A441;     /* readiness: yellow */
  --gut-no: #7A5230;      /* gut check: no (warm brown, the stoplight's third light) */
  --hover: #F6F9F3;
  --font: "Sora", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --hand: "Caveat", "Bradley Hand", "Segoe Print", cursive;
  --mono: ui-monospace, "SF Mono", Menlo, monospace;
  --r: 14px;
  --shadow: 0 1px 0 rgba(31,42,36,.06), 0 6px 18px -10px rgba(31,42,36,.25);
}
* { box-sizing: border-box; }
html, body { background: var(--ground); color: var(--ink); }
body { font-family: var(--font); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--bluegreen); }
:focus-visible { outline: 3px solid var(--bluegreen); outline-offset: 2px; border-radius: 6px; }
h1, h2, h3 { text-wrap: balance; margin: 0; }
p { margin: 0; }
.num { font-variant-numeric: tabular-nums; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; scroll-behavior: auto !important; } }

/* ---------- Shell ---------- */
.rail { display: none; }
main {
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 calc(110px + env(safe-area-inset-bottom, 0px));
  max-width: 880px; margin: 0 auto;
}
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
  background: var(--paper); border-top: 1px solid var(--line);
  display: grid; grid-template-columns: repeat(4, 1fr);
  padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px));
}
.tab { min-height: 56px; border: 0; background: none; border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 12px; font-weight: 500; color: var(--ink-3); }
.tab svg { width: 24px; height: 24px; }
.tab[aria-current="page"] { color: var(--forest); font-weight: 700; }
.tab[aria-current="page"] .tab-ico { background: var(--sage-soft); }
.tab-ico { width: 52px; height: 30px; border-radius: 15px; display: grid; place-items: center; }
@media (min-width: 960px) {
  .app { display: grid; grid-template-columns: 240px 1fr; }
  .tabbar { display: none; }
  .rail { display: flex; flex-direction: column; gap: 6px; position: sticky; top: 0; height: 100vh; padding: 0 14px 24px; background: var(--paper); border-right: 1px solid var(--line); }
  .rail-band { margin: 0 -14px 12px; height: 70px; overflow: hidden; }
  .rail-band img { width: 100%; height: 100%; object-fit: cover; object-position: 30% 62%; display: block; }
  .rail-brand { font-weight: 700; font-size: 17px; padding: 4px 10px 14px; line-height: 1.2; }
  .rail-brand small { display: block; font-weight: 500; font-size: 12px; color: var(--ink-3); }
  .rail button { display: flex; align-items: center; gap: 12px; min-height: 46px; padding: 0 12px; border: 0; border-radius: 10px; background: none; text-align: left; color: var(--ink-2); font-weight: 500; width: 100%; }
  .rail button svg { width: 22px; height: 22px; }
  .rail button[aria-current="page"] { background: var(--sage-soft); color: var(--forest); font-weight: 700; }
  .rail-foot { margin-top: auto; font-size: 12px; color: var(--ink-3); padding: 0 10px; }
  main { padding-bottom: 64px; width: 100%; }
}

/* ---------- Mockup bar ---------- */
.mockbar { display: flex; align-items: center; justify-content: space-between; gap: 8px 14px; flex-wrap: wrap; padding: 8px 0; font-size: 12px; color: var(--ink-3); }
.mockbar .seg button { min-height: 32px; font-size: 12px; }

/* ---------- Felt frame pieces ---------- */
.band { height: 92px; overflow: hidden; margin: 0 calc(-1 * max(16px, env(safe-area-inset-left, 0px))); position: relative; }
.band img { width: 100%; height: 100%; object-fit: cover; display: block; }
@media (min-width: 700px) { .band { height: 128px; margin: 0; border-radius: 0 0 18px 18px; } }
.screen-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; padding: 16px 0 14px; flex-wrap: wrap; }
.screen-head h1 { font-size: 26px; line-height: 1.15; font-weight: 700; letter-spacing: -.01em; }
.eyebrow { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .09em; color: var(--ink-3); }
.tag { position: relative; display: inline-flex; align-items: center; gap: 6px; font-family: var(--hand); font-weight: 700; font-size: 20px; line-height: 1; color: var(--kraft-ink); background: var(--kraft); padding: 5px 12px 5px 22px; border-radius: 4px 9px 9px 4px; clip-path: polygon(10px 0, 100% 0, 100% 100%, 10px 100%, 0 50%); white-space: nowrap; }
.tag::before { content: ""; position: absolute; left: 11px; top: 50%; width: 6px; height: 6px; margin-top: -3px; border-radius: 50%; background: var(--ground); box-shadow: inset 0 0 0 1.5px rgba(59,44,26,.45); }
.tag.sm { font-size: 17px; padding: 3px 10px 3px 20px; }
.polaroid { background: var(--paper); padding: 5px 5px 4px; box-shadow: 0 2px 10px -3px rgba(31,42,36,.35); transform: rotate(-3deg); display: grid; gap: 2px; flex: none; width: 96px; }
.polaroid img { width: 100%; aspect-ratio: 1; object-fit: cover; display: block; max-width: 100%; }
.polaroid figcaption { font-family: var(--hand); font-size: 17px; font-weight: 700; text-align: center; color: var(--kraft-ink); line-height: 1.1; }
.polaroid.r { transform: rotate(3deg); }
.felt-c { width: 52px; height: 52px; border-radius: 50%; object-fit: cover; flex: none; border: 3px solid var(--paper); box-shadow: 0 1px 6px -2px rgba(31,42,36,.4); display: block; }
.agent-note { display: flex; gap: 12px; align-items: center; padding: 12px 14px; }
.agent-note p { font-size: 14px; min-width: 0; }
.agent-note strong { display: block; }

/* ---------- Common ---------- */
.card { background: var(--paper); border-radius: var(--r); box-shadow: var(--shadow); }
.section { display: grid; gap: 12px; margin-top: 26px; }
.section > h2, .h2 { font-size: 17px; font-weight: 700; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.count-pill { font-size: 12px; font-weight: 600; background: var(--sage-soft); color: var(--ink-2); border-radius: 999px; padding: 2px 9px; }
.btn { min-height: 44px; padding: 0 16px; border-radius: 12px; border: 1px solid var(--line); background: var(--paper); font-weight: 600; font-size: 14px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; color: var(--ink); }
.btn.primary { background: var(--forest); border-color: var(--forest); color: #fff; }
.btn.ghost { background: transparent; border-color: transparent; color: var(--ink-2); }
.btn.sm { min-height: 40px; padding: 0 12px; font-size: 13px; }
.btn:hover { border-color: var(--ink-3); }
.btn.primary:hover { background: #1b3325; }
.btn[disabled] { opacity: .45; cursor: default; }
.dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex: none; }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 500; color: var(--ink-2); background: var(--ground); border-radius: 999px; padding: 3px 10px; white-space: nowrap; }
.ok { display: inline-flex; align-items: center; gap: 5px; background: var(--sage-soft); color: var(--forest); font-weight: 600; font-size: 12.5px; border-radius: 999px; padding: 2px 10px; white-space: nowrap; }
.drafted { font-size: 11px; font-weight: 600; color: var(--ink-3); border: 1px dashed var(--ink-3); border-radius: 999px; padding: 0 7px; line-height: 18px; white-space: nowrap; }
.muted { color: var(--ink-3); }
.small { font-size: 13px; }
.mono { font-family: var(--mono); font-size: 12.5px; word-break: break-all; }
.example-note { font-size: 12px; color: var(--ink-3); margin-top: 28px; text-align: center; }
.seg { display: inline-flex; background: var(--ground); border-radius: 10px; padding: 3px; gap: 2px; flex-wrap: wrap; }
.seg button { min-height: 38px; min-width: 44px; padding: 0 10px; border: 0; background: none; border-radius: 8px; font-size: 13px; font-weight: 600; color: var(--ink-2); }
.seg button[aria-pressed="true"] { background: var(--paper); color: var(--forest); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.xbtn { width: 44px; height: 44px; border-radius: 12px; border: 0; background: none; display: grid; place-items: center; color: var(--ink-3); flex: none; }
.xbtn:hover { background: var(--ground); color: var(--ink); }

/* ---------- Off-target flag: two treatments to choose from ---------- */
/* Coral dot: a pill with a big coral dot, card untouched. Coral edge: no pill, a thick coral stripe down the card and under the words. */
.flag { display: inline-flex; align-items: center; gap: 7px; font-weight: 700; font-size: 12.5px; white-space: nowrap; color: var(--ink); }
:root[data-flag="dot"] .flag { background: var(--paper); border: 1.5px solid var(--coral); border-radius: 999px; padding: 2px 10px 2px 7px; }
:root[data-flag="dot"] .flag::before { content: ""; width: 11px; height: 11px; border-radius: 50%; background: var(--coral); flex: none; }
:root[data-flag="edge"] .flag { padding: 0; border-radius: 0; text-decoration: underline 3px var(--coral); text-underline-offset: 4px; }
:root[data-flag="edge"] .card.edge-on { box-shadow: inset 7px 0 0 var(--coral), var(--shadow); }
:root[data-flag="edge"] .mrow.edge-on { box-shadow: inset 4px 0 0 var(--coral); }

/* ---------- Readiness light ---------- */
.ready { display: flex; gap: 12px; align-items: center; padding: 12px 14px; }
.lamp { display: inline-flex; gap: 4px; padding: 5px 6px; background: var(--ink); border-radius: 999px; flex: none; }
.lamp i { width: 14px; height: 14px; border-radius: 50%; background: #3E4A43; display: block; }
.lamp.red i:nth-child(1) { background: var(--coral); box-shadow: 0 0 8px var(--coral); }
.lamp.yellow i:nth-child(2) { background: var(--caution); box-shadow: 0 0 8px var(--caution); }
.lamp.green i:nth-child(3) { background: #9DC35A; box-shadow: 0 0 8px #9DC35A; }
.ready .what { min-width: 0; display: grid; gap: 1px; }
.ready .what strong { font-size: 15px; }
.ready .what span { font-size: 13.5px; color: var(--ink-2); }
.rdot { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--ink-2); }
.rdot i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
.rdot.green i { background: var(--go); } .rdot.yellow i { background: var(--caution); } .rdot.red i { background: var(--coral); }

/* ---------- Ideas ---------- */
.tabs { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tabs button { flex: none; min-height: 42px; padding: 0 16px; border-radius: 999px; border: 1px solid var(--line); background: var(--paper); font-weight: 600; font-size: 14px; color: var(--ink-2); display: inline-flex; align-items: center; gap: 8px; }
.tabs button[aria-selected="true"] { background: var(--forest); border-color: var(--forest); color: #fff; }
.tabs button[aria-selected="true"] .count-pill { background: rgba(255,255,255,.18); color: #fff; }
.idea-grid { display: grid; gap: 12px; }
@media (min-width: 700px) { .idea-grid { grid-template-columns: 1fr 1fr; align-items: start; } }
.idea-card { padding: 14px 14px 8px; display: grid; gap: 9px; }
.idea-card h3 { font-size: 16px; font-weight: 600; line-height: 1.35; }
.idea-meta { display: flex; flex-wrap: wrap; gap: 6px; }
.srcline { font-size: 12.5px; color: var(--ink-3); display: flex; gap: 6px; align-items: center; min-width: 0; }
.srcline span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hookline { font-size: 13.5px; color: var(--ink-2); border-left: 3px solid var(--sage); padding: 2px 0 2px 10px; }
.hookline.pick { border-left-color: var(--kraft); color: var(--kraft-ink); font-weight: 600; }
.card-actions { display: flex; gap: 2px; border-top: 1px solid var(--ground); padding-top: 6px; margin: 0 -6px; flex-wrap: wrap; }
.card-actions .btn { border-color: transparent; background: none; min-height: 42px; padding: 0 10px; color: var(--ink-2); }
.card-actions .btn:hover { background: var(--ground); }
.card-actions .btn.go { color: var(--forest); }
.card-actions .open { margin-left: auto; color: var(--forest); }
.why { font-size: 14px; background: var(--ground); border-radius: 10px; padding: 8px 12px; }
.why b { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-3); display: block; }
.rehook-badge { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 700; color: var(--ink); background: var(--paper); border: 1.5px solid var(--coral); border-radius: 999px; padding: 2px 10px 2px 8px; justify-self: start; }
.rehook-badge::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--coral); }
.empty { padding: 26px 20px; text-align: center; display: grid; justify-items: center; gap: 10px; }

/* ---------- Plan week ---------- */
.weeknav { display: grid; grid-template-columns: 48px 1fr 48px; align-items: center; gap: 8px; padding: 14px 0 6px; }
.weeknav .mid { text-align: center; min-width: 0; }
.weeknav h1 { font-size: 24px; font-weight: 700; line-height: 1.2; }
.weeknav .sub { font-size: 13px; color: var(--ink-2); }
.arrow { width: 48px; height: 48px; border-radius: 50%; border: 1px solid var(--line); background: var(--paper); display: grid; place-items: center; color: var(--forest); }
.arrow[disabled] { opacity: .35; cursor: default; }
.lockstamp { justify-self: center; }
.trail { padding: 12px 12px 10px; }
.trail-in { max-width: 560px; margin: 0 auto; }
.trail svg { width: 100%; height: auto; display: block; overflow: visible; }
.trail-labels { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; text-align: center; font-size: 11.5px; line-height: 1.25; color: var(--ink-3); margin-top: 4px; }
.trail-labels .cur { color: var(--ink); font-weight: 700; }
.trail-labels .done { color: var(--forest); font-weight: 600; }
.deck { display: grid; gap: 10px; }
.deck-card { display: grid; grid-template-columns: 1fr auto; gap: 4px 6px; padding: 12px 6px 12px 14px; align-items: start; }
.deck-card .body { display: grid; gap: 6px; min-width: 0; }
.deck-card h3 { font-size: 15.5px; font-weight: 600; line-height: 1.35; }
.deck-card .open-link { border: 0; background: none; padding: 0; text-align: left; font: inherit; color: inherit; cursor: pointer; }
.deck-card .open-link:hover h3 { text-decoration: underline; text-decoration-color: var(--sage); text-underline-offset: 3px; }
.deck-line { display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: 12.5px; color: var(--ink-2); align-items: center; }
.st { font-size: 12px; font-weight: 700; border-radius: 999px; padding: 1px 9px; background: var(--sage-soft); color: var(--forest); white-space: nowrap; }
.st.in-progress { background: #E2E8F0; color: var(--bluegreen); }
.st.scheduled { background: #EDE6F2; color: var(--plum); }
.st.published { background: var(--forest); color: #fff; }
.after-lock { font-size: 11.5px; font-weight: 600; color: var(--ink-3); border: 1px solid var(--line); border-radius: 6px; padding: 0 6px; }
.mixhead { display: flex; justify-content: space-between; align-items: center; gap: 4px 12px; flex-wrap: wrap; }
.dimlist { display: grid; gap: 8px; }
.dimrow { overflow: hidden; }
.dim-toggle { width: 100%; border: 0; background: none; text-align: left; padding: 12px 14px; display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; align-items: center; min-height: 56px; }
.dim-toggle:hover { background: var(--hover); }
.dim-toggle .t { font-weight: 700; font-size: 15px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.dim-toggle .line { grid-column: 1; font-size: 13px; color: var(--ink-2); min-width: 0; }
.dim-toggle .chev { grid-row: 1 / span 2; grid-column: 2; color: var(--ink-3); transition: transform .15s; }
.dim-toggle[aria-expanded="true"] .chev { transform: rotate(90deg); }
.win { font-size: 10.5px; font-weight: 700; color: var(--ink-3); border: 1px solid var(--line); border-radius: 6px; padding: 0 5px; text-transform: uppercase; letter-spacing: .05em; }
.dim-body { padding: 0 14px 10px; display: grid; gap: 4px; }
.fixes { display: grid; gap: 8px; background: var(--ground); border-radius: 12px; padding: 10px 12px; margin-bottom: 6px; }
.fixes .fx-h { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-3); }
.fix { display: grid; gap: 6px; }
.fix p { font-size: 14px; font-weight: 600; }
.cand { display: flex; gap: 8px; align-items: center; justify-content: space-between; background: var(--paper); border-radius: 10px; padding: 4px 4px 4px 12px; }
.cand span { font-size: 13.5px; min-width: 0; }
.cand .btn { flex: none; }
.dim-note { font-size: 12.5px; color: var(--ink-3); }
.mrow { padding: 10px 0 6px; display: grid; gap: 6px; border-top: 1px solid var(--ground); }
.mrow.bad { padding-left: 10px; margin-left: -10px; }
.mrow-head { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.mrow-head .lab { font-weight: 600; font-size: 14px; }
.mrow-head .cnt { font-weight: 700; font-size: 15px; }
.mrow-head .tgt { font-size: 12.5px; color: var(--ink-3); }
.mrow-head .flag, .mrow-head .ok { margin-left: auto; font-size: 11.5px; }
.track { position: relative; height: 34px; margin: 0 4px; touch-action: none; }
.track .base { position: absolute; left: 0; right: 0; top: 14px; height: 6px; border-radius: 3px; background: var(--ground); }
.track .band2 { position: absolute; top: 9px; height: 16px; border-radius: 8px; background: var(--sage); }
.track .tick { position: absolute; top: 15px; width: 4px; height: 4px; margin-left: -2px; border-radius: 50%; background: var(--line); }
.track .marker { position: absolute; top: 5px; width: 24px; height: 24px; margin-left: -12px; border-radius: 50%; background: var(--forest); color: #fff; font-size: 12px; font-weight: 700; display: grid; place-items: center; z-index: 2; pointer-events: none; transition: left .15s; }
.mrow.bad .marker { background: var(--paper); color: var(--ink); box-shadow: 0 0 0 3px var(--coral); }
.track .h { position: absolute; top: -5px; width: 44px; height: 44px; margin-left: -22px; border: 0; background: none; padding: 0; z-index: 3; touch-action: none; cursor: ew-resize; }
.track .h::before { content: ""; position: absolute; left: 18px; top: 9px; width: 8px; height: 26px; border-radius: 4px; background: var(--paper); border: 2px solid var(--forest); }
.track .h:focus-visible { outline: none; }
.track .h:focus-visible::before { outline: 3px solid var(--bluegreen); outline-offset: 2px; }
.scale { position: relative; height: 14px; margin: 0 4px; font-size: 10.5px; color: var(--ink-3); }
.scale span { position: absolute; transform: translateX(-50%); }
.switch { display: inline-flex; align-items: center; gap: 10px; min-height: 44px; border: 0; background: none; font-size: 13.5px; font-weight: 500; color: var(--ink-2); padding: 0; }
.switch .sw { width: 42px; height: 24px; border-radius: 12px; background: var(--line); position: relative; transition: background .15s; flex: none; }
.switch .sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; transition: left .15s; box-shadow: 0 1px 2px rgba(0,0,0,.2); }
.switch[aria-checked="true"] .sw { background: var(--forest); }
.switch[aria-checked="true"] .sw::after { left: 21px; }
.lockcard { padding: 16px; display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
.lockcard .lc-body { flex: 1; min-width: 200px; display: grid; gap: 8px; }
.lockcard h2 { font-size: 18px; }
.lock-btn { min-height: 56px; font-size: 16px; padding: 0 22px; }
.confirm { display: grid; gap: 8px; background: var(--ground); border-radius: 12px; padding: 10px 12px; }
.past-row { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; padding: 12px 14px; border-bottom: 1px solid var(--ground); align-items: center; }
.past-row:last-child { border-bottom: 0; }
.past-row .tt { font-weight: 600; font-size: 14.5px; min-width: 0; }
.past-row .meta { grid-column: 1 / -1; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; font-size: 12.5px; color: var(--ink-3); }
.ph-chart { height: 60px; border-radius: 10px; border: 1.5px dashed var(--line); overflow: hidden; }
.ph-chart svg { width: 100%; height: 100%; display: block; }

/* ---------- Idea ---------- */

.links { display: grid; gap: 10px; border-top: 1px solid var(--ground); padding-top: 12px; }

.chat-preview { background: var(--ground); border-radius: 12px; padding: 12px; display: grid; gap: 8px; font-size: 14px; }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(88px + env(safe-area-inset-bottom, 0px)); z-index: 50; background: var(--ink); color: #fff; padding: 8px 8px 8px 16px; border-radius: 12px; font-size: 14px; font-weight: 500; max-width: calc(100% - 32px); width: max-content; box-shadow: 0 8px 24px rgba(0,0,0,.2); display: flex; align-items: center; gap: 12px; min-height: 48px; }

/* ---------- Config ---------- */

  const stops = ['Pick ideas', 'Reviewed', w === CUR_WEEK ? 'Film Wed' : 'Film', 'Edit and schedule', 'Posted'];
  const xs = [34, 102, 170, 238, 306];
  const ys = [30, 18, 30, 18, 26];
  const path = 'M34 30 C 60 6, 80 8, 102 18 S 146 40, 170 30 S 214 8, 238 18 S 284 34, 306 26';
  const circ = xs.map((x, k) => {
    const y = ys[k];
    if (k === 4) return `<g transform="translate(${x - 12} ${y - 20})"><path d="M2 22 L22 22" stroke="var(--kraft-ink)" stroke-width="3" stroke-linecap="round"/><path d="M12 2 C 18 9, 20 13, 16 19 C 14 21, 10 21, 8 19 C 4 14, 8 9, 12 2Z" fill="${cur >= 4 ? 'var(--coral)' : 'var(--line)'}"/><path d="M12 10 C 14 13, 15 15, 13 18 C 12 19, 11 19, 10 18 C 9 16, 10 13, 12 10Z" fill="${cur >= 4 ? 'var(--peach)' : 'var(--paper)'}"/></g>`;

  }).join('');
  return `<div class="card trail" aria-label="Week progress: ${stops[Math.min(cur, 4)]}">
    <div class="trail-in"><svg viewBox="0 0 340 46" aria-hidden="true"><path d="${path}" fill="none" stroke="var(--kraft)" stroke-width="7" stroke-linecap="round"/><path d="${path}" fill="none" stroke="var(--kraft-ink)" stroke-width="1.4" stroke-dasharray="5 6" opacity=".55"/>${circ}</svg>
    <div class="trail-labels">${stops.map((s, k) => `<span class="${k === cur ? 'cur' : k < cur ? 'done' : ''}">${s}</span>`).join('')}</div>

function meterRow(r) {

  return `<div class="mrow ${r.bad ? 'bad edge-on' : ''}" data-key="${esc(r.key)}" data-label="${esc(r.label)}" data-count="${r.count}" data-scale="${r.scale}">
    <div class="mrow-head">${r.color ? `<span class="dot" style="background:${r.color}"></span>` : ''}<span class="lab">${esc(r.label)}</span><span class="cnt num">${r.count}</span><span class="tgt">${targetText(r.key)}</span>

function paintMeters() {

    const [lo, hi] = S.targets[key]; const pct = v => (v / cells * 100).toFixed(3) + '%';
    const b = row.querySelector('.band2');
    b.style.left = pct(Math.min(lo, scale)); b.style.width = pct(Math.min(hi, scale) - Math.min(lo, scale) + 1);
    row.querySelector('.marker').style.left = pct(Math.min(count, scale) + .5);
    const hlo = row.querySelector('[data-end="lo"]'), hhi = row.querySelector('[data-end="hi"]');
    if (hlo) { hlo.style.left = pct(lo); hlo.setAttribute('aria-valuenow', lo); }
    if (hhi) { hhi.style.left = pct(Math.min(hi, scale) + 1); hhi.setAttribute('aria-valuenow', hi); }

    const head = row.querySelector('.mrow-head');
    head.querySelector('.tgt').textContent = targetText(key);

function nextEp(name, i) {
  const eps = S.ideas.filter(x => x.series === name && x !== i).map(x => x.ep || 0);
  return (eps.length ? Math.max(...eps) : 0) + 1;
}
function setField(id, k, v) {
  const i = idea(id); let from;
  if (k.startsWith('look.')) { from = i.look[k.slice(5)]; i.look[k.slice(5)] = v; }
  else { from = i[k]; i[k] = k === 'take' ? (v ? Number(v) : null) : (v === '' && (k === 'story') ? null : v); }
  if (k === 'series') i.ep = v ? (from === v ? i.ep : nextEp(v, i)) : null;

function wireSortables() {
  document.querySelectorAll('.vlist').forEach(list => {
    list.querySelectorAll('.handle').forEach(hd => hd.addEventListener('pointerdown', e => {
      e.preventDefault(); const item = hd.closest('.vid'); hd.setPointerCapture(e.pointerId); item.classList.add('dragging');
      const mv = ev => {
        const sibs = [...list.querySelectorAll('.vid')].filter(s => s !== item);
        const after = sibs.find(s => { const r = s.getBoundingClientRect(); return ev.clientY < r.top + r.height / 2; });
        if (after) list.insertBefore(item, after); else list.appendChild(item);
      };
      const up = () => {
        hd.removeEventListener('pointermove', mv); hd.removeEventListener('pointerup', up); hd.removeEventListener('pointercancel', up);
        item.classList.remove('dragging');
        const ids = [...list.querySelectorAll('.vid')].map(v => v.dataset.vid);
        const g = S.ros[list.dataset.b].groups[list.dataset.g];
        if (ids.join() !== g.ids.join()) { g.ids = ids; toast('Filming order saved.'); }
      };
      hd.addEventListener('pointermove', mv); hd.addEventListener('pointerup', up); hd.addEventListener('pointercancel', up);
    }));
  });
}

    if (S.filmed[i.id] && i.status === 'on deck') { i.status = 'in progress'; toast('Filmed. Status moved to in progress.'); }

document.addEventListener('submit', e => e.preventDefault());

document.addEventListener('focusout', e => { if (e.target.dataset && e.target.dataset.addinput) setTimeout(() => { if (S.adding) { S.adding = null; render(); } }, 150); });

/* Range dragging: saves straight away, with undo */
function setEnd(key, end, v, scale) {
  const r = S.targets[key]; v = Math.max(0, Math.min(scale, v));
  if (end === 'lo') v = Math.min(v, r[1]); else v = Math.max(v, r[0]);

}

  h.addEventListener('pointermove', mv); h.addEventListener('pointerup', up); h.addEventListener('pointercancel', up);
});

render();
